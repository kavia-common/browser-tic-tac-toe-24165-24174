<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Double-view calendar</title>
  <!-- Webfont: Inter and Lexend via Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" role="main">
    <section class="calendar-double" aria-label="Double-view calendar">
      <!-- Left calendar -->
      <div class="calendar-card" aria-label="Calendar left">
        <header class="calendar-header">
          <button class="btn-ctrl" aria-label="Previous month">
            <span class="icon chevron-left" aria-hidden="true"></span>
          </button>
          <div class="selectors">
            <button class="select select-month" aria-haspopup="listbox" aria-expanded="false">
              <span class="label">April</span>
              <span class="icon caret-down" aria-hidden="true"></span>
            </button>
            <button class="select select-year" aria-haspopup="listbox" aria-expanded="false">
              <span class="label">2021</span>
              <span class="icon caret-down" aria-hidden="true"></span>
            </button>
          </div>
          <div class="btn-ctrl is-placeholder" aria-hidden="true"></div>
        </header>

        <div class="dow" aria-hidden="true">
          <div class="dow-cell">Mo</div>
          <div class="dow-cell">Tu</div>
          <div class="dow-cell">We</div>
          <div class="dow-cell">Th</div>
          <div class="dow-cell">Fr</div>
          <div class="dow-cell">Sa</div>
          <div class="dow-cell">Su</div>
        </div>

        <div class="weeks" role="grid" aria-readonly="true">
          <!-- Week 1 -->
          <div class="week" role="row">
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>29</span></button>
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>30</span></button>
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>31</span></button>
            <button class="day" role="gridcell"><span>1</span></button>
            <button class="day" role="gridcell"><span>2</span></button>
            <button class="day" role="gridcell"><span>3</span></button>
            <button class="day" role="gridcell"><span>4</span></button>
          </div>
          <!-- Week 2 -->
          <div class="week" role="row">
            <button class="day" role="gridcell"><span>5</span></button>
            <button class="day" role="gridcell"><span>6</span></button>
            <button class="day is-today" role="gridcell" aria-current="date"><span>7</span></button>
            <button class="day" role="gridcell"><span>8</span></button>
            <button class="day" role="gridcell"><span>9</span></button>
            <button class="day" role="gridcell"><span>10</span></button>
            <button class="day" role="gridcell"><span>11</span></button>
          </div>
          <!-- Week 3 -->
          <div class="week" role="row">
            <button class="day" role="gridcell"><span>12</span></button>
            <button class="day" role="gridcell"><span>13</span></button>
            <button class="day" role="gridcell"><span>14</span></button>
            <button class="day" role="gridcell"><span>15</span></button>
            <button class="day" role="gridcell"><span>16</span></button>
            <button class="day" role="gridcell"><span>17</span></button>
            <button class="day" role="gridcell"><span>18</span></button>
          </div>
          <!-- Week 4 -->
          <div class="week" role="row">
            <button class="day" role="gridcell"><span>19</span></button>
            <button class="day" role="gridcell"><span>20</span></button>
            <button class="day" role="gridcell"><span>21</span></button>
            <button class="day" role="gridcell"><span>22</span></button>
            <button class="day" role="gridcell"><span>23</span></button>
            <button class="day" role="gridcell"><span>24</span></button>
            <button class="day" role="gridcell"><span>25</span></button>
          </div>
          <!-- Week 5 -->
          <div class="week" role="row">
            <button class="day" role="gridcell"><span>26</span></button>
            <button class="day" role="gridcell"><span>27</span></button>
            <button class="day" role="gridcell"><span>28</span></button>
            <button class="day" role="gridcell"><span>29</span></button>
            <button class="day" role="gridcell"><span>30</span></button>
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>1</span></button>
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>2</span></button>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="divider" aria-hidden="true"></div>

      <!-- Right calendar -->
      <div class="calendar-card" aria-label="Calendar right">
        <header class="calendar-header">
          <div class="btn-ctrl is-placeholder" aria-hidden="true"></div>
          <div class="selectors">
            <button class="select select-month" aria-haspopup="listbox" aria-expanded="false">
              <span class="label">May</span>
              <span class="icon caret-down" aria-hidden="true"></span>
            </button>
            <button class="select select-year" aria-haspopup="listbox" aria-expanded="false">
              <span class="label">2021</span>
              <span class="icon caret-down" aria-hidden="true"></span>
            </button>
          </div>
          <button class="btn-ctrl" aria-label="Next month">
            <span class="icon chevron-right" aria-hidden="true"></span>
          </button>
        </header>

        <div class="dow" aria-hidden="true">
          <div class="dow-cell">Mo</div>
          <div class="dow-cell">Tu</div>
          <div class="dow-cell">We</div>
          <div class="dow-cell">Th</div>
          <div class="dow-cell">Fr</div>
          <div class="dow-cell">Sa</div>
          <div class="dow-cell">Su</div>
        </div>

        <div class="weeks" role="grid" aria-readonly="true">
          <!-- Week rows mirror the left, adjust as needed for May -->
          <div class="week" role="row">
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>29</span></button>
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>30</span></button>
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>31</span></button>
            <button class="day" role="gridcell"><span>1</span></button>
            <button class="day" role="gridcell"><span>2</span></button>
            <button class="day" role="gridcell"><span>3</span></button>
            <button class="day" role="gridcell"><span>4</span></button>
          </div>
          <div class="week" role="row">
            <button class="day" role="gridcell"><span>5</span></button>
            <button class="day" role="gridcell"><span>6</span></button>
            <button class="day" role="gridcell"><span>7</span></button>
            <button class="day" role="gridcell"><span>8</span></button>
            <button class="day" role="gridcell"><span>9</span></button>
            <button class="day" role="gridcell"><span>10</span></button>
            <button class="day" role="gridcell"><span>11</span></button>
          </div>
          <div class="week" role="row">
            <button class="day" role="gridcell"><span>12</span></button>
            <button class="day" role="gridcell"><span>13</span></button>
            <button class="day" role="gridcell"><span>14</span></button>
            <button class="day" role="gridcell"><span>15</span></button>
            <button class="day" role="gridcell"><span>16</span></button>
            <button class="day" role="gridcell"><span>17</span></button>
            <button class="day" role="gridcell"><span>18</span></button>
          </div>
          <div class="week" role="row">
            <button class="day" role="gridcell"><span>19</span></button>
            <button class="day" role="gridcell"><span>20</span></button>
            <button class="day" role="gridcell"><span>21</span></button>
            <button class="day" role="gridcell"><span>22</span></button>
            <button class="day" role="gridcell"><span>23</span></button>
            <button class="day" role="gridcell"><span>24</span></button>
            <button class="day" role="gridcell"><span>25</span></button>
          </div>
          <div class="week" role="row">
            <button class="day" role="gridcell"><span>26</span></button>
            <button class="day" role="gridcell"><span>27</span></button>
            <button class="day" role="gridcell"><span>28</span></button>
            <button class="day" role="gridcell"><span>29</span></button>
            <button class="day" role="gridcell"><span>30</span></button>
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>1</span></button>
            <button class="day is-muted" role="gridcell" aria-disabled="true"><span>2</span></button>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="./script.js"></script>
</body>
</html>
