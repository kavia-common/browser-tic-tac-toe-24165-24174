<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Calendar - Regular 7:1482</title>
  <!-- Lexend font from Google Fonts (as per design tokens) -->
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app" role="main">
    <section class="calendar" aria-label="Calendar Component">
      <header class="calendar__header">
        <button class="calendar__nav calendar__nav--prev" aria-label="Previous month">
          <!-- Left chevron -->
          <span class="icon icon--chevron" aria-hidden="true"></span>
        </button>
        <div class="calendar__current">
          <button class="calendar__select calendar__select--month" aria-haspopup="listbox" aria-expanded="false">
            <span class="calendar__select-label">April</span>
            <span class="icon icon--caret" aria-hidden="true"></span>
          </button>
          <button class="calendar__select calendar__select--year" aria-haspopup="listbox" aria-expanded="false">
            <span class="calendar__select-label">2021</span>
            <span class="icon icon--caret" aria-hidden="true"></span>
          </button>
        </div>
        <button class="calendar__nav calendar__nav--next" aria-label="Next month">
          <!-- Right chevron -->
          <span class="icon icon--chevron icon--chevron-right" aria-hidden="true"></span>
        </button>
      </header>

      <div class="calendar__dow" aria-hidden="true">
        <div class="calendar__dow-cell">Mo</div>
        <div class="calendar__dow-cell">Tu</div>
        <div class="calendar__dow-cell">We</div>
        <div class="calendar__dow-cell">Th</div>
        <div class="calendar__dow-cell">Fr</div>
        <div class="calendar__dow-cell">Sa</div>
        <div class="calendar__dow-cell">Su</div>
      </div>

      <div class="calendar__weeks" role="grid" aria-readonly="true">
        <!-- Week 1 -->
        <div class="calendar__week" role="row">
          <button class="calendar__day calendar__day--muted" role="gridcell" aria-disabled="true"><span>29</span></button>
          <button class="calendar__day calendar__day--muted" role="gridcell" aria-disabled="true"><span>30</span></button>
          <button class="calendar__day calendar__day--muted" role="gridcell" aria-disabled="true"><span>31</span></button>
          <button class="calendar__day" role="gridcell"><span>1</span></button>
          <button class="calendar__day" role="gridcell"><span>2</span></button>
          <button class="calendar__day" role="gridcell"><span>3</span></button>
          <button class="calendar__day" role="gridcell"><span>4</span></button>
        </div>
        <!-- Week 2 -->
        <div class="calendar__week" role="row">
          <button class="calendar__day" role="gridcell"><span>5</span></button>
          <button class="calendar__day" role="gridcell"><span>6</span></button>
          <button class="calendar__day calendar__day--today" role="gridcell" aria-current="date"><span>7</span></button>
          <button class="calendar__day" role="gridcell"><span>8</span></button>
          <button class="calendar__day" role="gridcell"><span>9</span></button>
          <button class="calendar__day" role="gridcell"><span>10</span></button>
          <button class="calendar__day" role="gridcell"><span>11</span></button>
        </div>
        <!-- Week 3 -->
        <div class="calendar__week" role="row">
          <button class="calendar__day" role="gridcell"><span>12</span></button>
          <button class="calendar__day" role="gridcell"><span>13</span></button>
          <button class="calendar__day" role="gridcell"><span>14</span></button>
          <button class="calendar__day" role="gridcell"><span>15</span></button>
          <button class="calendar__day" role="gridcell"><span>16</span></button>
          <button class="calendar__day" role="gridcell"><span>17</span></button>
          <button class="calendar__day" role="gridcell"><span>18</span></button>
        </div>
        <!-- Week 4 -->
        <div class="calendar__week" role="row">
          <button class="calendar__day" role="gridcell"><span>19</span></button>
          <button class="calendar__day" role="gridcell"><span>20</span></button>
          <button class="calendar__day" role="gridcell"><span>21</span></button>
          <button class="calendar__day" role="gridcell"><span>22</span></button>
          <button class="calendar__day" role="gridcell"><span>23</span></button>
          <button class="calendar__day" role="gridcell"><span>24</span></button>
          <button class="calendar__day" role="gridcell"><span>25</span></button>
        </div>
        <!-- Week 5 -->
        <div class="calendar__week" role="row">
          <button class="calendar__day" role="gridcell"><span>26</span></button>
          <button class="calendar__day" role="gridcell"><span>27</span></button>
          <button class="calendar__day" role="gridcell"><span>28</span></button>
          <button class="calendar__day" role="gridcell"><span>29</span></button>
          <button class="calendar__day" role="gridcell"><span>30</span></button>
          <button class="calendar__day calendar__day--muted" role="gridcell" aria-disabled="true"><span>1</span></button>
          <button class="calendar__day calendar__day--muted" role="gridcell" aria-disabled="true"><span>2</span></button>
        </div>
      </div>
    </section>
  </main>

  <script src="./script.js"></script>
</body>
</html>
